<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Узоры из плиток</title>
<style>
:root{color-scheme:light;--ink:#172126;--muted:#607077;--paper:#f1f5f2;--card:#fff;--line:#ccd8d2;--accent:#176b62;--accent2:#d8754e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1060px;margin:auto;padding:32px 20px 52px}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}h1{font:700 clamp(2.3rem,6vw,4.8rem)/.95 Georgia,serif;letter-spacing:-.05em;max-width:9ch;margin:14px 0}.lede{color:var(--muted);font-size:1.1rem;max-width:55ch}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;margin-top:30px}.preview,.controls{background:var(--card);border:1px solid var(--line);border-radius:20px}.preview{padding:12px;min-height:520px;display:grid;place-items:center}.preview svg{width:100%;height:auto;max-height:600px;border-radius:12px;background:#edf2ef}.controls{padding:22px}.controls h2{font:700 1.5rem Georgia,serif;margin:0 0 18px}label{display:grid;gap:6px;margin:16px 0;font-weight:700}input[type=color]{height:44px;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3px}input[type=range],input[type=number]{width:100%;min-height:40px}input[type=number]{border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit}output{color:var(--muted);font-weight:400}button{width:100%;min-height:45px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-weight:800;cursor:pointer;margin-top:8px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid #e5a07e;outline-offset:2px}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.status{color:var(--muted);font-size:.9rem;min-height:2.7em}.note{font-size:.86rem;color:var(--muted);margin-top:18px}@media(max-width:700px){main{padding:24px 16px 44px}.layout{grid-template-columns:1fr;gap:14px}.preview{min-height:auto;padding:8px}.controls{border-radius:16px}.preview svg{max-height:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main><span class="eyebrow">Редакция Полки · геометрическая лаборатория</span><h1>Узор из плиток</h1><p class="lede">Одна плитка, повторённая много раз, создаёт ритм. Меняйте плотность и цвета, чтобы увидеть, как локальное решение влияет на всю поверхность.</p>
<div class="layout"><section class="preview" aria-label="Предпросмотр узора"><svg id="pattern" viewBox="0 0 720 520" role="img" aria-labelledby="pattern-title pattern-desc"><title id="pattern-title">Настраиваемый узор</title><desc id="pattern-desc">Повторяющиеся геометрические плитки.</desc><g id="tiles"></g></svg></section>
<section class="controls" aria-labelledby="controls-title"><h2 id="controls-title">Настройки</h2><label for="primary">Основной цвет<input id="primary" type="color" value="#176b62"></label><label for="secondary">Акцентный цвет<input id="secondary" type="color" value="#d8754e"></label><label for="density">Плотность <output id="density-value">6 × 5</output><input id="density" type="range" min="3" max="10" value="6"></label><label for="seed">Seed <output id="seed-value">7</output><input id="seed" type="number" min="0" max="999" step="1" value="7"></label><button id="apply" class="primary" type="button">Применить узор</button><button id="reset" type="button">Вернуть исходный</button><p id="status" class="status" role="status" aria-live="polite"></p><p class="note">Это визуальный эскиз: настройки не записываются и исчезнут после закрытия страницы.</p></section></div></main>
<script>
(()=>{const svg=document.querySelector('#pattern'),group=document.querySelector('#tiles'),primary=document.querySelector('#primary'),secondary=document.querySelector('#secondary'),density=document.querySelector('#density'),seed=document.querySelector('#seed'),densityValue=document.querySelector('#density-value'),seedValue=document.querySelector('#seed-value'),status=document.querySelector('#status');const defaults={primary:'#176b62',secondary:'#d8754e',density:6,seed:7};function bounded(input,fallback,min,max){const value=Number(input);return Number.isInteger(value)&&value>=min&&value<=max?value:fallback}function random(state){state.value=(Math.imul(state.value^ (state.value>>>16),2246822519)>>>0);state.value=(state.value^(state.value>>>13))>>>0;return state.value/4294967296}function paint(){const cols=bounded(density.value,defaults.density,3,10),s=bounded(seed.value,defaults.seed,0,999),rows=Math.max(3,Math.round(cols*5/6)),w=720/cols,h=520/rows,state={value:(s+0x9e3779b9)>>>0};density.value=String(cols);seed.value=String(s);group.replaceChildren();for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const tilt=random(state)>.5,opacity=.72+random(state)*.28,rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',String(x*w));rect.setAttribute('y',String(y*h));rect.setAttribute('width',String(w+.5));rect.setAttribute('height',String(h+.5));rect.setAttribute('fill',tilt?primary.value:secondary.value);rect.setAttribute('opacity',String(opacity));group.append(rect);const line=document.createElementNS('http://www.w3.org/2000/svg','path');const pad=Math.min(w,h)*.18;line.setAttribute('d',tilt?`M ${x*w+pad} ${y*h+pad} L ${(x+1)*w-pad} ${(y+1)*h-pad}`:`M ${(x+1)*w-pad} ${y*h+pad} L ${x*w+pad} ${(y+1)*h-pad}`);line.setAttribute('stroke',tilt?secondary.value:primary.value);line.setAttribute('stroke-width',String(Math.max(2,Math.min(w,h)*.06)));line.setAttribute('stroke-linecap','round');group.append(line)}densityValue.textContent=cols+' × '+rows;seedValue.textContent=String(s);status.textContent='Узор обновлён: '+cols+' столбцов, seed '+s+'.'}function reset(){primary.value=defaults.primary;secondary.value=defaults.secondary;density.value=String(defaults.density);seed.value=String(defaults.seed);paint()}document.querySelector('#apply').addEventListener('click',paint);document.querySelector('#reset').addEventListener('click',reset);density.addEventListener('input',()=>{const cols=bounded(density.value,defaults.density,3,10);densityValue.textContent=cols+' × '+Math.max(3,Math.round(cols*5/6))});seed.addEventListener('input',()=>{seedValue.textContent=String(bounded(seed.value,defaults.seed,0,999))});paint()})();
</script></body></html>
