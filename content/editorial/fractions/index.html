<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дроби на тарелке — пять задач</title>
<style>
:root{--ink:#202329;--muted:#6a6f78;--paper:#fffaf1;--card:#fff;--line:#e7dccb;--accent:#b54b2c;--good:#2e7250;--bad:#a53f3f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:clamp(24px,6vw,72px) 20px 64px}header{display:flex;justify-content:space-between;gap:18px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:22px}h1,h2{font-family:Georgia,serif;line-height:1.1;letter-spacing:-.02em}h1{font-size:clamp(2.2rem,6vw,4.5rem);max-width:650px;margin:16px 0}h2{font-size:clamp(1.5rem,3vw,2.1rem);margin:0 0 14px}.kicker{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.dek{font-size:1.15rem;color:var(--muted);max-width:650px;margin:0}.progress{display:flex;align-items:center;gap:12px;margin:30px 0 18px}.track{height:8px;flex:1;background:#eadfce;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s ease}.count{color:var(--muted);font-variant-numeric:tabular-nums}.question{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,42px);box-shadow:0 15px 40px #5b32110d}.question-number{color:var(--accent);font-weight:750;margin:0 0 12px}.pizza{width:132px;height:132px;border-radius:50%;margin:24px 0;background:conic-gradient(#edb84b 0 25%,#f8d987 25% 50%,#edb84b 50% 75%,#f8d987 75%);border:8px solid #f3c96d;box-shadow:inset 0 0 0 3px #d89638;position:relative}.pizza:after{content:"";position:absolute;inset:23%;border-radius:50%;background:#c87541;box-shadow:36px 10px 0 -9px #a95832,-23px 18px 0 -8px #a95832,8px -25px 0 -9px #a95832}.choices{display:grid;gap:10px;margin:24px 0}.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;color:var(--ink);font:inherit;cursor:pointer}.choice:hover,.choice:focus-visible{border-color:var(--accent);background:#fff7ed}.choice[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 3px #b54b2c22}.choice:disabled{cursor:default;opacity:.8}.choice b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f3eadc;color:var(--accent)}.feedback{border-left:4px solid var(--accent);background:#fff7ed;padding:14px 16px;margin:18px 0}.feedback.good{border-color:var(--good);background:#edf8f0}.feedback.bad{border-color:var(--bad);background:#fff0ef}.feedback strong{display:block;margin-bottom:3px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px}.button{border:0;border-radius:999px;padding:12px 19px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.button:disabled{opacity:.45;cursor:not-allowed}.result{background:#f1e9dc;border-radius:18px;padding:25px;margin-top:20px}.result strong{font-size:1.7rem;color:var(--accent)}footer{color:var(--muted);font-size:.9rem;margin-top:28px}button:focus-visible{outline:3px solid #e2a541;outline-offset:3px}@media(max-width:500px){header{display:block}.pizza{margin:20px auto}.actions{align-items:stretch;flex-direction:column-reverse}.actions .button{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main>
<header><div><div class="kicker">Мини-урок · 5 задач</div><h1>Дроби на тарелке</h1><p class="dek">Раздели целое на равные части, сравни доли и объясни свой выбор.</p></div><div aria-hidden="true" style="font-size:2rem">¼</div></header>
<div class="progress" aria-label="Прогресс урока"><div class="track"><i id="bar" style="width:20%"></i></div><span class="count" id="count">1 из 5</span></div>
<section class="question" aria-live="polite" id="question"></section><footer>Автор: Редакция Полки · самостоятельный учебный материал с вымышленными примерами</footer>
</main>
<script>
const tasks=[
{q:'Пиццу разделили на 4 равных кусочка. Какую часть пиццы составляет один кусочек?',d:'Один кусочек — это одна из четырёх равных частей целого, то есть 1/4.',a:['1/2','1/4','4/1'],c:1},
{q:'Лена съела 2 из 4 равных кусочков. Какая дробь показывает съеденную часть?',d:'Числитель показывает выбранные части (2), знаменатель — все равные части (4).',a:['2/4','4/2','1/4'],c:0},
{q:'Какая доля больше: 1/3 или 1/6?',d:'При одинаковом целом треть состоит из более крупных частей, чем шестая: 1/3 больше 1/6.',a:['1/3','1/6','Они равны'],c:0},
{q:'Три четверти торта уже разложены по тарелкам. Какая часть осталась?',d:'Целое — это 4/4. После 3/4 остаётся 1/4.',a:['3/4','1/4','4/3'],c:1},
{q:'В коробке 8 равных долек, 6 отмечены синим. Какую долю составляют синие дольки?',d:'Отмечено 6 частей из 8, значит ответ — 6/8. Эту дробь можно сократить до 3/4, но 6/8 точно описывает коробку.',a:['8/6','3/8','6/8'],c:2}];
let index=0,score=0,answered=false;const root=document.querySelector('#question'),bar=document.querySelector('#bar'),count=document.querySelector('#count');
function render(){const t=tasks[index];answered=false;count.textContent=`${index+1} из ${tasks.length}`;bar.style.width=`${(index+1)/tasks.length*100}%`;root.innerHTML=`<p class="question-number">Задача ${index+1}</p><h2>${t.q}</h2>${index===0?'<div class="pizza" aria-label="Пицца, разделённая на четыре части" role="img"></div>':''}<div class="choices" role="group" aria-label="Варианты ответа">${t.a.map((x,i)=>`<button class="choice" aria-pressed="false" data-i="${i}"><b>${String.fromCharCode(65+i)}</b><span>${x}</span></button>`).join('')}</div><div id="feedback"></div><div class="actions"><button class="button secondary" id="restart" type="button">Начать сначала</button><button class="button" id="next" type="button" disabled>${index===tasks.length-1?'Посмотреть результат':'Следующая задача'}</button></div>`;root.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.i))));root.querySelector('#next').addEventListener('click',next);root.querySelector('#restart').addEventListener('click',()=>{index=0;score=0;render()})}
function answer(choice){if(answered)return;answered=true;const t=tasks[index],ok=choice===t.c;if(ok)score++;root.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;b.setAttribute('aria-pressed',String(i===choice));if(i===t.c)b.style.borderColor='var(--good)'});const f=root.querySelector('#feedback');f.className=`feedback ${ok?'good':'bad'}`;f.innerHTML=`<strong>${ok?'Верно':'Почти'}</strong>${ok?'Хороший разбор. ':`Правильный ответ: ${t.a[t.c]}. `}${t.d}`;root.querySelector('#next').disabled=false}
function next(){if(!answered)return;if(index<tasks.length-1){index++;render()}else{root.innerHTML=`<div class="result"><div class="kicker">Финальный результат</div><h2>Урок завершён</h2><p><strong>${score} из ${tasks.length}</strong> правильных ответов.</p><p>${score===tasks.length?'Отлично: ты уверенно читаешь простые дроби.':'Вернись к задачам и посмотри объяснения — они помогут закрепить способ рассуждения.'}</p><button class="button" id="again" type="button">Пройти ещё раз</button></div>`;bar.style.width='100%';count.textContent='Готово';root.querySelector('#again').addEventListener('click',()=>{index=0;score=0;render()})}}
render();
</script></body></html>
