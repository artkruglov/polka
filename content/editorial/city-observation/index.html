<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как читать город — шесть шагов наблюдения</title>
<style>
:root{--ink:#18232d;--muted:#64717a;--paper:#f3f0e8;--card:#fffdf7;--line:#d9ded8;--accent:#176b63;--warm:#c76b42}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:clamp(22px,6vw,72px) 20px 58px}header{max-width:700px}.kicker{color:var(--accent);font-size:.74rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1,h2{font-family:Georgia,serif;line-height:1.08;letter-spacing:-.025em}h1{font-size:clamp(2.4rem,7vw,5rem);margin:15px 0}h2{font-size:clamp(1.8rem,4vw,3rem);margin:0 0 15px}.dek{font-size:1.15rem;color:var(--muted);max-width:680px}.map{height:120px;margin:28px 0;border:1px solid var(--line);border-radius:18px;background:linear-gradient(120deg,transparent 46%,#b8cec7 47% 50%,transparent 51%),linear-gradient(28deg,transparent 40%,#d8b99a 41% 43%,transparent 44%),#e7eee7;position:relative;overflow:hidden}.map:before,.map:after{content:"";position:absolute;border-radius:50%;background:#7aa58d}.map:before{width:16px;height:16px;left:22%;top:32%}.map:after{width:11px;height:11px;right:22%;bottom:25%;background:var(--warm)}.progress{display:flex;align-items:center;gap:13px;margin:28px 0 17px}.track{height:7px;flex:1;background:#dce1dc;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);transition:width .3s ease}.count{color:var(--muted);font-variant-numeric:tabular-nums}.slide{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(23px,5vw,48px);box-shadow:0 16px 45px #21352b0c;min-height:390px}.slide-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:start}.label{display:inline-block;padding:4px 9px;border-radius:999px;background:#e1f0eb;color:var(--accent);font-size:.8rem;font-weight:750}.prompt{border-left:4px solid var(--warm);padding:13px 16px;background:#fff5ec;margin:20px 0}.quote{font-family:Georgia,serif;font-size:1.35rem;color:var(--accent)}.visual{border:1px solid var(--line);border-radius:16px;background:#edf3ee;min-height:220px;padding:20px;display:grid;place-items:center;color:var(--muted);text-align:center}.bars{display:flex;align-items:end;gap:10px;height:150px}.bars i{width:30px;background:var(--accent);border-radius:6px 6px 0 0}.bars i:nth-child(1){height:55%}.bars i:nth-child(2){height:85%;background:#c76b42}.bars i:nth-child(3){height:40%}.route{width:90%;height:130px;border-top:3px solid var(--accent);border-bottom:3px solid #b8cec7;position:relative}.route:after{content:"";position:absolute;width:72%;height:3px;background:var(--warm);transform:rotate(-18deg);top:51%;left:14%}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.button{border:0;border-radius:999px;padding:12px 19px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.button:disabled{opacity:.4;cursor:not-allowed}.dots{display:flex;justify-content:center;gap:8px;margin:22px 0}.dot{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid var(--accent);background:transparent;cursor:pointer}.dot[aria-current=true]{background:var(--accent)}footer{color:var(--muted);font-size:.9rem;margin-top:28px}button:focus-visible{outline:3px solid #e5a24d;outline-offset:3px}@media(max-width:680px){.slide-grid{grid-template-columns:1fr}.visual{min-height:160px}.actions{flex-direction:column-reverse}.actions .button{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main tabindex="-1" id="page"><header><div class="kicker">Методика наблюдения · 6 шагов</div><h1>Как читать город</h1><p class="dek">Небольшая полевая тетрадь для внимательного взгляда. Город Липовый порт вымышлен; здесь нет готового исследования и фотографий.</p><div class="map" role="img" aria-label="Абстрактная схема вымышленного города с двумя точками наблюдения"></div></header><div class="progress" aria-label="Прогресс слайдов"><div class="track"><i id="bar" style="width:16.7%"></i></div><span class="count" id="count">1 из 6</span></div><section class="slide" id="slide" aria-live="polite"></section><nav class="dots" aria-label="Навигация по шагам" id="dots"></nav><footer>Автор: Редакция Полки · синтетическая учебная методика, не отчёт о реальном городе</footer></main>
<script>
const slides=[
['01 · Рамка','Выбери один маршрут','Наблюдение начинается с границы. Выбери короткий маршрут от площади до воды и не пытайся описать весь город сразу.','Запиши старт, финиш и время. Реши заранее, что сегодня смотришь: движение людей, доступность или паузы.','Маршрут — это линза, а не доказательство общей картины.'],
['02 · Поток','Считай движения, не впечатления','Поставь точку наблюдения у вымышленной остановки «Северная». В течение десяти минут отмечай направления и остановки, не записывая лиц и личные детали.','Сделай простую таблицу: время, направление, повод остановки. Отдельно пометь, что ты не смог увидеть.','Один отрезок времени показывает ритм места, но не объясняет его причины.'],
['03 · Порог','Замечай, где меняется доступ','Сравни вход в библиотеку и проход к набережной: есть ли понятный путь, где можно остановиться, что происходит с человеком на коляске или с велосипедом?','Опиши два перехода глаголами: «поворачивает», «ждёт», «обходит». Не подменяй наблюдение оценкой удобства.','Деталь порога помогает задать проверяемый вопрос о маршруте.'],
['04 · Контраст','Сопоставь два похожих места','Выбери две остановки на одном маршруте. Сравни только заранее выбранные признаки: тень, сиденья, шум или видимость перехода.','Сведи наблюдения в пару колонок и отметь уверенность: видел сам, услышал, предположил.','Контраст делает различие заметным, но не доказывает, почему оно возникло.'],
['05 · Проверка','Придумай маленькую проверку','Сформулируй вопрос: «Что помогает людям задержаться у площади?» Предложи один короткий способ проверить его в другой день.','Назови выборку и ограничение: например, два десятиминутных окна в будний день; не собирай имена и контакты.','Хорошая гипотеза оставляет место для результата, который ей противоречит.'],
['06 · Сборка','Собери заметку без лишних выводов','Сложи маршрут, наблюдения, контраст и следующий шаг в одну страницу. Отдели факт, интерпретацию и вопрос.','Проверь каждое предложение: могу ли я указать момент наблюдения? Если нет, перепиши его как предположение.','Финал метода — ясная следующая проверка, а не громкий вывод о городе.']];
let index=0;const slide=document.querySelector('#slide'),count=document.querySelector('#count'),bar=document.querySelector('#bar'),dots=document.querySelector('#dots');
function render(){const s=slides[index];count.textContent=`${index+1} из ${slides.length}`;bar.style.width=`${(index+1)/slides.length*100}%`;dots.innerHTML=slides.map((_,i)=>`<button class="dot" type="button" aria-label="Шаг ${i+1}" aria-current="${i===index}" data-i="${i}"></button>`).join('');dots.querySelectorAll('.dot').forEach(b=>b.addEventListener('click',()=>{index=Number(b.dataset.i);render()}));slide.innerHTML=`<div class="slide-grid"><div><span class="label">${s[0]}</span><h2>${s[1]}</h2><p>${s[2]}</p><div class="prompt"><strong>Задание.</strong> ${s[3]}</div><p class="quote">${s[4]}</p></div><div class="visual" aria-label="Схема к шагу ${index+1}">${index===0?'<div class="route" aria-hidden="true"></div>':index===1?'<div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>':index===2?'Порог<br>↗ путь · ▫ пауза':index===3?'Место A&nbsp;&nbsp; ↔ &nbsp;&nbsp;Место B':index===4?'Вопрос → проверка':'Факт · смысл · следующий шаг'}</div></div><div class="actions"><button class="button secondary" id="prev" type="button" ${index===0?'disabled':''}>← Назад</button><button class="button" id="next" type="button">${index===slides.length-1?'Начать сначала':'Дальше →'}</button></div>`;slide.querySelector('#prev').addEventListener('click',()=>{if(index){index--;render()}});slide.querySelector('#next').addEventListener('click',()=>{index=index===slides.length-1?0:index+1;render()})}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&index<slides.length-1){index++;render()}if(e.key==='ArrowLeft'&&index>0){index--;render()}});render();
</script></body></html>
