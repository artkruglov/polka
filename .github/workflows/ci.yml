name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Pull requests (including forks) get read-only access and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party code is pinned by commit SHA / image digest; the comment names
# the release the pin was taken from.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      # Disposable PostgreSQL and MinIO; the suite creates its own DB and bucket.
      - run: npm run local:setup
      - run: npm run infra:up
      - run: npm run check
      - run: npm run check:links
      - run: npm run build
      - run: npm test
      - name: Live viewer suite
        run: npm test -- --live
      # Unlicense: robust-predicates (via d3-delaunay), public-domain dedication.
      - name: Licenses of production dependencies
        run: >
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages
          --onlyAllow "MIT;MIT-0;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;Unlicense"

  runtime-grants:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
          cache: npm
      - run: npm ci
      - run: npm run local:setup
      - run: npm run infra:up
      # Temporary owner/runtime/purge/restore roles against the reviewed grants
      # recipes; the expected schema is the head of packages/migrations.ts.
      - name: Runtime, purge and restore grants (isolated)
        run: |
          schema=$(node --import tsx --input-type=module \
            -e 'import { CURRENT_SCHEMA_VERSION } from "./packages/migrations.ts"; console.log(CURRENT_SCHEMA_VERSION)')
          node --env-file=.env --import tsx scripts/test-runtime-grants-isolated.ts \
            --confirm-synthetic --expected-schema="$schema"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          # zricethezav/gitleaks:v8.24.2
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
      - run: docker build -t polka:ci .
      - name: Backup image builds
        run: docker build -t polka-backup:ci deploy/hosted/backup
      # Interpolation errors in the shipped compose files surface here, not
      # on an operator's server. Dummy values stand in for the secrets.
      - name: Compose files render
        env:
          POLKA_IMAGE: polka:ci
          APP_HOST: polka.example.com
          VIEWER_HOST_NAME: polka-view.example.com
        run: |
          cp deploy/hosted/hosted.env.example /tmp/hosted.env
          sed -i -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' /tmp/hosted.env
          docker compose -f deploy/hosted/compose.yml --env-file /tmp/hosted.env config --quiet
      - run: npm run local:setup
      - run: npm run infra:up
      - name: Smoke test the image (runtime role)
        run: node scripts/ci/image-smoke.mjs polka:ci
