name: Uptime

# External check of the installation named in the repository variables. A
# failed run is the alert: GitHub notifies whoever last changed this schedule.
# Forks and repositories without UPTIME_APP_ORIGIN skip the job.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    if: vars.UPTIME_APP_ORIGIN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16"
      - name: Check the installation
        run: node scripts/ci/uptime.mjs
        env:
          APP_ORIGIN: ${{ vars.UPTIME_APP_ORIGIN }}
          VIEWER_ORIGIN: ${{ vars.UPTIME_VIEWER_ORIGIN }}
          OPS_STATUS_TOKEN: ${{ secrets.OPS_STATUS_TOKEN }}
