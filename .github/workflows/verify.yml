# The checks of `npm run verify` (scripts/verify.mjs), on GitHub Actions.
# Each step calls verify.mjs --only=<id>, so the commands, the licence
# allowlist and the gitleaks digest are defined in one place.
name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      renderer:
        description: "Also run the renderer runtime check (Chromium + Docker, slow)"
        type: boolean
        default: false

# Pull requests (forks included) get read-only access and no secrets.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA and images by digest; the
# comment names the release the pin was taken from. Dependabot bumps them.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same disposable PostgreSQL and MinIO as local development
      # (deploy/compose.local.yml, default ports); the suites create and drop
      # their own databases and buckets, the grants suite finds the
      # containers through compose.
      - run: npm run local:setup
      # MinIO is compiled from source (deploy/minio/Dockerfile, ~10 min), so
      # the image is built once per Dockerfile and kept in the Actions cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/minio-image.tar
          key: minio-${{ hashFiles('deploy/minio/Dockerfile') }}
      - name: MinIO image
        run: |
          if [ -f /tmp/minio-image.tar ]; then
            docker load --input /tmp/minio-image.tar
          else
            docker compose --env-file=.env -f deploy/compose.local.yml build objects
            docker save --output /tmp/minio-image.tar polka-local-minio:RELEASE.2025-04-22T22-12-26Z
          fi
      - name: PostgreSQL and MinIO
        # Docker Hub's anonymous pull limit and its 5xx are shared by GitHub's
        # runners and pass: a pull that fails is tried again after a pause.
        run: for attempt in 1 2 3; do npm run infra:up && exit 0; sleep $((attempt * 60)); done; exit 1
      - name: Types and frontend layers
        run: node scripts/verify.mjs --only=check
      - name: Markdown links
        run: node scripts/verify.mjs --only=links
      - name: Web build
        run: node scripts/verify.mjs --only=build
      - name: Default suite
        run: node scripts/verify.mjs --only=test
      - name: Live viewer suite
        run: node scripts/verify.mjs --only=live
      - name: Database role grants (expected schema from packages/migrations.ts)
        run: node scripts/verify.mjs --only=grants
      - name: Licences of production dependencies
        run: node scripts/verify.mjs --only=licenses
      - name: Container logs on failure
        if: failure()
        run: docker compose --env-file=.env -f deploy/compose.local.yml logs --tail=100

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Secrets in history (gitleaks, pinned digest)
        run: node scripts/verify.mjs --only=secrets

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Application and backup images build
        # Base images come from Docker Hub; see the pause-and-retry note above.
        run: for attempt in 1 2 3; do node scripts/verify.mjs --only=image,backup-image && exit 0; sleep $((attempt * 60)); done; exit 1
      # Interpolation errors in the shipped compose files surface here, not on
      # an operator's server. Placeholders stand in for the secrets.
      - name: Hosted compose file renders
        env:
          POLKA_IMAGE: polka:verify
        run: |
          cp deploy/hosted/hosted.env.example "$RUNNER_TEMP/hosted.env"
          sed -i -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' "$RUNNER_TEMP/hosted.env"
          docker compose -f deploy/hosted/compose.yml --env-file "$RUNNER_TEMP/hosted.env" config --quiet
      - run: npm run local:setup
      # MinIO is compiled from source (deploy/minio/Dockerfile, ~10 min), so
      # the image is built once per Dockerfile and kept in the Actions cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/minio-image.tar
          key: minio-${{ hashFiles('deploy/minio/Dockerfile') }}
      - name: MinIO image
        run: |
          if [ -f /tmp/minio-image.tar ]; then
            docker load --input /tmp/minio-image.tar
          else
            docker compose --env-file=.env -f deploy/compose.local.yml build objects
            docker save --output /tmp/minio-image.tar polka-local-minio:RELEASE.2025-04-22T22-12-26Z
          fi
      - name: PostgreSQL and MinIO
        # Docker Hub's anonymous pull limit and its 5xx are shared by GitHub's
        # runners and pass: a pull that fails is tried again after a pause.
        run: for attempt in 1 2 3; do npm run infra:up && exit 0; sleep $((attempt * 60)); done; exit 1
      # Migrations as the schema owner, the app as an unprivileged runtime
      # role; /healthz, /readyz and the front page must answer.
      - name: Image smoke (runtime role)
        run: node scripts/ci/image-smoke.mjs polka:verify

  renderer-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium-headless-shell
      - run: npm run test:renderer-runtime
