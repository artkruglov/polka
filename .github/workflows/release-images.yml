# Published images of a release, so a company deploys Полка without
# building it (deploy/hosted/README.md, «Быстрый путь»):
#   ghcr.io/<owner>/polka:<version>         the application (Dockerfile)
#   ghcr.io/<owner>/polka-backup:<version>  the backup job (deploy/hosted/backup)
# and :latest for both on a release that is not a prerelease (vX.Y.Z, no
# suffix). linux/amd64 and linux/arm64 (arm64 under emulation, the web
# bundle included: the Dockerfile stays buildable by the legacy builder).
# Each image carries OCI labels, a SLSA provenance attestation and an SPDX
# SBOM (BuildKit attestations, visible with `docker buildx imagetools inspect`).
#
# The first push creates the packages as private: the owner makes each one
# public once (GitHub → Packages → polka / polka-backup → Package settings →
# Change visibility), or a VM cannot pull without a token.
name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned by commit SHA (see verify.yml); the comment
# names the release the pin was taken from. Dependabot bumps them.
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polka
            context: .
            file: Dockerfile
            title: Полка
            description: "Полка: a private shelf for AI-made HTML artifacts, reports and files, with expiring share links."
          - name: polka-backup
            context: deploy/hosted/backup
            file: deploy/hosted/backup/Dockerfile
            title: Полка backup job
            description: "pg_dump of a single-VM Полка to a private, versioned S3 bucket (deploy/hosted)."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # v0.16.0 → 0.16.0 and latest; v0.16.0-rc.1 → 0.16.0-rc.1 only.
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=Полка
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/deploy/hosted/README.md
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Published
        env:
          NAME: ${{ matrix.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $NAME"
            echo
            printf '%s\n' "$TAGS" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
