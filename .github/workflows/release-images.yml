# Published images of a release, so a company deploys Полка without
# building it (deploy/hosted/README.md, «Быстрый путь»):
#   ghcr.io/<owner>/polka:<version>         the application (Dockerfile)
#   ghcr.io/<owner>/polka-backup:<version>  the backup job (deploy/hosted/backup)
# and :latest for both on a release that is not a prerelease (vX.Y.Z, no
# suffix). linux/amd64 and linux/arm64 (arm64 under emulation, the web
# bundle included: the Dockerfile stays buildable by the legacy builder).
# Each image carries OCI labels, a SLSA provenance attestation and an SPDX
# SBOM (BuildKit attestations, visible with `docker buildx imagetools inspect`).
#
# The first push creates the packages as private: the owner makes each one
# public once (GitHub → Packages → polka / polka-backup → Package settings →
# Change visibility), or a VM cannot pull without a token.
name: release-images

on:
  push:
    tags: ["v*"]
  # Publish an existing release again (or one tagged before this workflow worked).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.16.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

# Only GitHub's own actions are allowed in this repository (pinned by SHA,
# see verify.yml); the build itself is plain docker buildx below.
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polka
            context: .
            file: Dockerfile
            title: Полка
            description: "Полка: a private shelf for AI-made HTML artifacts, reports and files, with expiring share links."
          - name: polka-backup
            context: deploy/hosted/backup
            file: deploy/hosted/backup/Dockerfile
            title: Полка backup job
            description: "pg_dump of a single-VM Полка to a private, versioned S3 bucket (deploy/hosted)."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      # The repository allows GitHub's own actions only, so the docker/* actions
      # are plain commands here: buildx ships with the runner image, QEMU
      # comes from the binfmt image pinned by digest (qemu-v9.2.2).
      - name: QEMU for arm64
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6 --install arm64
      - name: Builder
        run: docker buildx create --use --name release --driver docker-container
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push
        env:
          NAME: ${{ matrix.name }}
          CONTEXT: ${{ matrix.context }}
          FILE: ${{ matrix.file }}
          TITLE: ${{ matrix.title }}
          DESCRIPTION: ${{ matrix.description }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$REF" in v[0-9]*) ;; *) echo "not a release tag: $REF" >&2; exit 1 ;; esac
          SHA=$(git rev-parse HEAD)
          version="${REF#v}"
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$NAME"
          # v0.16.0 → 0.16.0 and latest; v0.16.0-rc.1 → 0.16.0-rc.1 only.
          tags="--tag $image:$version"
          case "$version" in *-*) ;; *) tags="$tags --tag $image:latest" ;; esac
          docs="https://github.com/$REPO/blob/$REF/deploy/hosted/README.md"
          # shellcheck disable=SC2086
          docker buildx build --push --platform linux/amd64,linux/arm64 \
            --file "$FILE" $tags \
            --provenance mode=max --sbom true \
            --label "org.opencontainers.image.title=$TITLE" \
            --label "org.opencontainers.image.description=$DESCRIPTION" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --label "org.opencontainers.image.vendor=Полка" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.documentation=$docs" \
            --annotation "index:org.opencontainers.image.title=$TITLE" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.source=https://github.com/$REPO" \
            "$CONTEXT"
          {
            echo "### $NAME"
            echo
            echo "    $image:$version"
            case "$version" in *-*) ;; *) echo "    $image:latest" ;; esac
          } >> "$GITHUB_STEP_SUMMARY"
