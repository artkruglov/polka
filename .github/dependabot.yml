# Security and version updates. Every dependency is pinned exactly, so nothing
# moves unless one of these pull requests is reviewed and merged. Minor and
# patch updates come grouped, one pull request per ecosystem and week; majors
# come one by one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories:
      - /
      - /deploy/hosted/backup
      - /apps/renderer
    schedule: { interval: weekly }
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
