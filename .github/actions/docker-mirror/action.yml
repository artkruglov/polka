# Docker Hub limits anonymous pulls per IP, and GitHub's runners share their
# IPs: whole runs failed with "toomanyrequests" (October 2026). The daemon
# asks Google's public cache of Docker Hub first and falls back to Docker Hub
# for an image the cache lacks. Images stay pinned by digest, so the bytes
# are the same either way.
name: Docker Hub through mirror.gcr.io
description: Point the runner's Docker daemon at mirror.gcr.io before any pull.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        config=/etc/docker/daemon.json
        current=$(sudo cat "$config" 2>/dev/null || echo '{}')
        echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"], "debug": true}' | sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker version --format 'server {{.Server.Version}}'
        docker info --format '{{json .RegistryConfig.Mirrors}} {{.Driver}} {{json .DriverStatus}}'
        docker pull -q postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3 || true
        sudo journalctl -u docker --since "-3min" --no-pager | grep -iE "mirror|registry-1|endpoint|Trying to pull|error" | tail -25 || true
