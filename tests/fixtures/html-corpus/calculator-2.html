<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>calculator-2 — Полка</title><style>body{font:18px system-ui;margin:0;padding:24px;max-width:920px;color:#14233b;background:#f5f7fb}button,input{font:inherit;padding:10px;margin:8px 4px}article{padding:24px;background:white;border-radius:8px}svg{max-width:100%;height:auto}button:focus-visible{outline:3px solid #245dff}h1{font-size:clamp(26px,5vw,48px)}</style><main><h1>calculator-2</h1><p>Оригинальный тестовый материал Полки. Все значения вымышлены и предназначены только для проверки отображения, взаимодействия и переноса страницы. Это не опубликованное исследование и не данные реального пользователя.</p><article><label>Количество<input id="quantity" type="number" value="2" min="0"></label><label>Цена<input id="price" type="number" value="100" min="0"></label><button id="calculate">Посчитать</button><output id="result" aria-live="polite">—</output><script>document.getElementById("calculate").onclick=()=>{document.getElementById("result").textContent=String(Number(document.getElementById("quantity").value)*Number(document.getElementById("price").value));};</script></article></main></html>
