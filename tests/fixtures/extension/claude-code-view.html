<!doctype html>
<!--
  Synthetic fixture for tests/extension-extract.test.ts: a claude.ai artifact
  panel switched to its «Code» tab. The source is shown in a CodeMirror-style
  editor (one .cm-line per line), no rendering frame and no Copy button.
  Modelled on public descriptions, not copied from Claude's markup.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude</title>
</head>
<body>
<aside class="artifact-panel">
  <header>
    <h2>Отчёт о продажах</h2>
    <div role="tablist">
      <button role="tab" aria-selected="false">Preview</button>
      <button role="tab" aria-selected="true">Code</button>
    </div>
  </header>
  <div class="code-view" data-language="html">
    <div class="cm-editor">
      <div class="cm-content">
        <div class="cm-line">&lt;!doctype html&gt;</div>
        <div class="cm-line">&lt;html&gt;&lt;head&gt;&lt;title&gt;Отчёт о продажах&lt;/title&gt;&lt;/head&gt;</div>
        <div class="cm-line">&lt;body&gt;&lt;h1&gt;Продажи&nbsp;за&nbsp;квартал&lt;/h1&gt;&lt;/body&gt;</div>
        <div class="cm-line">&lt;/html&gt;</div>
      </div>
    </div>
  </div>
</aside>
</body>
</html>
