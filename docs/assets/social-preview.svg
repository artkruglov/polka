<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- GitHub social preview (Settings → Social preview). Rendered to
       docs/assets/social-preview.png by
       `node scripts/render-readme-assets.mjs social`. Same style as the link
       preview cards in docs/design/og. -->
  <style>
    @font-face { font-family: "Polka Sans"; src: url("../../apps/web/public/fonts/IBMPlexSans-Regular.ttf"); font-weight: 400; }
    @font-face { font-family: "Polka Sans"; src: url("../../apps/web/public/fonts/IBMPlexSans-SemiBold.ttf"); font-weight: 600; }
    text { font-family: "Polka Sans", -apple-system, sans-serif; }
    .brand { font-size: 46px; font-weight: 600; letter-spacing: -2.5px; fill: #0f1420; }
    .title { font-size: 76px; font-weight: 600; letter-spacing: -2.8px; fill: #0f1420; }
    .accent { fill: #1f4fff; }
    .lead { font-size: 30px; font-weight: 400; fill: #647087; }
    .url { font-size: 30px; font-weight: 600; fill: #0f1420; }
    .chip { font-size: 22px; font-weight: 600; fill: #1a3fd1; }
    .meta { font-size: 22px; font-weight: 400; fill: #647087; }
  </style>
  <defs>
    <linearGradient id="wave-fill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dbe5ff" />
      <stop offset=".5" stop-color="#c7d6ff" />
      <stop offset="1" stop-color="#e6ddff" />
    </linearGradient>
    <linearGradient id="wave-line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f4fff" stop-opacity=".55" />
      <stop offset=".6" stop-color="#7b8cff" stop-opacity=".5" />
      <stop offset="1" stop-color="#b48cff" stop-opacity=".35" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f1420" flood-opacity=".10" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#fafbfe" />
  <g transform="translate(0 486)">
    <path d="M0 110 C220 -20 360 200 640 84 S1080 0 1280 64 L1280 160 L0 160Z" fill="url(#wave-fill)" opacity=".75" />
    <path d="M0 126 C250 92 320 -8 580 54 S890 186 1280 36" fill="none" stroke="url(#wave-line)" stroke-width="2" />
    <path d="M0 146 C320 56 400 28 680 88 S1050 82 1280 22" fill="none" stroke="#c9d5ff" stroke-width="1.5" />
  </g>

  <!-- Mark + wordmark -->
  <g transform="translate(80 72)">
    <rect width="56" height="56" rx="12" fill="#1f4fff" />
    <g transform="scale(.875)">
      <path d="M21 42V21h22v21" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M13 50h38" stroke="#fff" stroke-width="4.5" stroke-linecap="round" />
    </g>
    <text class="brand" x="74" y="42">полка</text>
  </g>

  <text class="title" x="80" y="268">Сделали с агентом,</text>
  <text class="title accent" x="80" y="354">покажите другим.</text>
  <text class="lead" x="82" y="424">Сохраните работу из чата — получатель</text>
  <text class="lead" x="82" y="464">откроет её по ссылке без аккаунта.</text>
  <text class="url" x="82" y="538">polochka.app</text>
  <text class="meta" x="290" y="537">Открытый код · AGPL-3.0</text>

  <!-- A saved page, drawn as an abstract document. -->
  <g transform="translate(900 110) rotate(3)" filter="url(#shadow)">
    <rect width="300" height="380" rx="16" fill="#ffffff" stroke="#e7ebf1" stroke-width="2" />
    <rect x="28" y="34" width="84" height="10" rx="5" fill="#b8caff" />
    <rect x="28" y="64" width="220" height="22" rx="6" fill="#0f1420" opacity=".9" />
    <rect x="28" y="96" width="160" height="22" rx="6" fill="#0f1420" opacity=".9" />
    <rect x="28" y="144" width="244" height="10" rx="5" fill="#e7ebf1" />
    <rect x="28" y="166" width="230" height="10" rx="5" fill="#e7ebf1" />
    <rect x="28" y="188" width="196" height="10" rx="5" fill="#e7ebf1" />
    <rect x="28" y="226" width="244" height="104" rx="10" fill="#edf2ff" />
    <path d="M44 306 C80 262 112 300 148 270 S214 250 256 244" fill="none" stroke="#1f4fff" stroke-width="4" stroke-linecap="round" />
  </g>
  <g transform="translate(852 440)" filter="url(#shadow)">
    <rect width="214" height="56" rx="28" fill="#ffffff" stroke="#b8caff" stroke-width="2" />
    <g transform="translate(24 16)" fill="none" stroke="#1f4fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 14a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" />
      <path d="M14 10a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" />
    </g>
    <text class="chip" x="62" y="36">по ссылке</text>
  </g>
</svg>
