function toast(s){const el=document.getElementById('toast');el.textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.textContent='',4200)}
function go(view,opts={}){state={...state,...opts,view};render();window.scrollTo({top:0,behavior:'instant'})}
function sidebar(){return `<aside>${brand()}<div class="account"><span class="badge">АК</span><div><b>Личная полка</b><div class="muted small">Артём · пример</div></div></div><nav class="nav" aria-label="Основная навигация"><button data-action="home" class="${state.view==='shelf'&&state.filter==='all'?'active':''}">${icon('grid')}Моя полка<span class="count">${docs.length}</span></button><button data-action="recent" class="${state.filter==='recent'?'active':''}">${icon('clock')}Недавние</button><button data-action="favorites" class="${state.filter==='favorites'?'active':''}">${icon('star')}Избранное</button></nav><div><p class="nav-label">Папки</p><nav class="nav" aria-label="Папки">${['Команда','Проекты','Для вдохновения'].map(f=>`<button data-action="folder" data-folder="${f}" class="${state.view==='folder'&&state.folder===f?'active':''}">${icon('folder')}${f}</button>`).join('')}</nav></div><div class="side-foot"><p class="small">Ваши идеи — рядом</p><div class="storage"><span></span></div><p class="small muted">3 примера для знакомства</p></div></aside>`}
function header(){return `<header class="topbar"><button class="btn square quiet mobile-menu" data-action="home" aria-label="Открыть мою полку">${icon('grid')}</button><label class="search">${icon('search')}<input id="search" type="search" aria-label="Найти на полке" placeholder="Найти на полке" value="${esc(state.query)}"><span class="keyboard" aria-hidden="true">⌕</span></label><div class="grow"></div><button class="btn quiet square" data-action="upload" aria-label="Добавить работу">${icon('plus')}</button><span class="badge" aria-label="Демонстрационный профиль">АК</span></header>`}
function thumb(d){return `<div class="thumb ${d.cover}"><div class="eyebrow">${esc(d.type.toUpperCase())} / 2026</div><h3>${d.id==='pulse'?'Меньше шума.<br>Больше результата.':d.id==='launch'?'Хорошая идея.<br>Первый шаг.':'Город начинается<br>со встречи.'}</h3>${d.id==='cities'?'<div class="orb"></div>':`<div class="mini-chart">${[35,48,61,78,100].map(h=>`<span style="height:${h}%"></span>`).join('')}</div>`}</div>`}
function cards(){const items=docs.filter(d=>(state.view!=='folder'||d.folder===state.folder)&&(state.filter!=='favorites'||d.fav)&&d.name.toLocaleLowerCase('ru').includes(state.query.toLocaleLowerCase('ru')));return items.length?items.map(d=>`<article class="artifact"><button data-action="open" data-id="${d.id}" aria-label="Открыть ${esc(d.name)}">${thumb(d)}<div class="artifact-info"><h3>${esc(d.name)}</h3><p class="small muted">${esc(d.type)} · версия ${d.version}</p><div class="artifact-meta"><span>${d.id==='pulse'?'Изменено сегодня':'На вашей полке'}</span><span class="tag">${icon(accessIcon[d.access])}${accessLabel[d.access]}</span></div></div></button></article>`).join(''):`<div class="empty"><h2>Здесь пока пусто</h2><p class="muted" style="margin-top:10px">${state.query?'Попробуйте другое название.':'Добавьте первую работу в эту папку.'}</p></div>`}
function shelf(){let title=state.view==='folder'?state.folder:state.filter==='favorites'?'Избранное':state.filter==='recent'?'Недавние работы':'Моя полка';return `${state.view==='folder'?`<div class="crumb"><button data-action="home">Моя полка</button><span>/</span><span>${esc(state.folder)}</span></div>`:''}<div class="intro row spread"><div><h1>${esc(title)}</h1><p class="muted">${state.view==='folder'?'Работы в одном месте. Доступ настраивается у каждой отдельно.':'Всё, что хочется сохранить, показать и продолжить.'}</p></div><button class="btn primary" data-action="upload">${icon('plus')}Добавить работу</button></div>${state.view==='shelf'&&state.filter==='all'?`<div class="create-strip"><div class="circle-icon">${icon('upload')}</div><div class="grow"><h3>Готово в чате? Положите на полку.</h3><p class="muted small">HTML, презентация или отчёт — с вашим доступом и постоянной ссылкой.</p></div><button class="btn" data-action="paste">Вставить HTML${icon('arrow')}</button></div><div class="section-label row spread"><h3>Папки</h3><span class="small muted">Личное пространство</span></div><div class="folders">${['Команда','Проекты','Для вдохновения'].map(f=>`<button class="folder" data-action="folder" data-folder="${f}">${icon('folder')}<span class="grow"><b>${f}</b><small>${docs.filter(d=>d.folder===f).length} работа</small></span></button>`).join('')}</div>`:''}<div class="section-label row spread"><h3>${state.query?'Результаты поиска':'Ваши работы'}</h3><span class="small muted">Обложки</span></div><div class="grid" id="cards">${cards()}</div>`}
function report(d,version){return `<article class="paper" aria-label="Демонстрационный отчёт, версия ${version}"><div class="paper-top"><div><p class="eyebrow">КОМАНДА / СЕНТЯБРЬ 2026</p><h2>${d.id==='cities'?'Город начинается<br>с хорошего разговора.':d.id==='launch'?'От хорошей идеи —<br>к первому результату.':'Меньше шума.<br>Больше результата.'}</h2></div><span class="paper-stamp">Еженедельный обзор</span></div><p class="lead">Мы освободили время для главного: доводим начатое, обсуждаем решения и делимся тем, что работает.</p><div class="metrics"><div class="metric"><strong>${version>=3?'28':'24'}</strong><span>задач завершено</span></div><div class="metric"><strong>−18%</strong><span>времени на встречи</span></div><div class="metric"><strong>4,8</strong><span>оценка команды</span></div></div><div class="report-bottom"><div><div class="row spread"><h3>Работа движется</h3><span class="small muted">Завершённые задачи</span></div><div class="chart" role="img" aria-label="Демонстрационный рост числа завершённых задач по неделям"><div class="chart-col" style="height:41%"><span>12 авг</span></div><div class="chart-col" style="height:56%"><span>19 авг</span></div><div class="chart-col" style="height:62%"><span>26 авг</span></div><div class="chart-col" style="height:74%"><span>2 сен</span></div><div class="chart-col latest" style="height:95%"><span>9 сен</span></div></div></div><div class="insight"><span class="small muted">Что помогло</span><h3>Меньше переключений.<br>Больше завершённых дел.</h3><p>Один общий приоритет на неделю и короткие письменные обновления вместо лишних встреч.</p></div></div><div class="paper-foot"><span>Демонстрационные данные · пример оформления</span><span>Полка / версия ${version}</span></div></article>`}
function work(){const d=current();return `<div class="crumb"><button data-action="home">Моя полка</button><span>/</span><button data-action="folder" data-folder="${d.folder}">${d.folder}</button></div><div class="workhead row spread"><div><h1>${esc(d.name)}</h1><div class="row wrap" style="margin-top:12px"><span class="tag">${icon(accessIcon[d.access])}${d.revoked?'Ссылка отключена':accessLabel[d.access]}</span><span class="small muted">${icon('check')} На полке · версия ${d.version}</span></div></div><div class="actions"><button class="btn" data-action="versions">${icon('clock')}Версии</button><button class="btn primary" data-action="share">${icon('link')}Поделиться</button></div></div>${d.published&&d.version>d.published&&!d.pinned&&!d.revoked?`<div class="version-notice"><span>На полке — <b>версия ${d.version}</b>. По ссылке пока <b>версия ${d.published}</b>.</span><button class="btn" data-action="publish-update">Обновить по ссылке${icon('arrow')}</button></div>`:''}${report(d,d.version)}<div class="viewer-foot"><span>HTML-отчёт · исходник сохранён</span><div class="row"><button data-action="new-version">Загрузить новую версию</button><span>·</span><button data-action="recipient">Вид получателя</button></div></div>`}
function versions(){const d=current();return `<div class="crumb"><button data-action="work">${esc(d.name)}</button><span>/</span><span>Версии</span></div><div class="intro"><h1>Каждое изменение на месте</h1><p class="muted">Сохраняйте новое. Отправленная ссылка меняется только по вашему действию.</p></div><div class="version-list">${Array.from({length:d.version},(_,i)=>d.version-i).map(v=>`<div class="version-row"><span class="version-circle">v${v}</span><div class="grow"><h3>Версия ${v}</h3><p class="small muted">${v===d.version?'Последняя сохранённая · сегодня':'Предыдущий результат'}</p></div>${v===d.published?`<span class="tag">${icon('link')}${d.pinned?'Закреплённый снимок':'Сейчас по ссылке'}</span>`:v===d.version?'<span class="tag gold">Новая версия</span>':''}<button class="btn" data-action="view-version" data-version="${v}">Посмотреть</button></div>`).join('')}</div><button class="btn" data-action="new-version">${icon('upload')}Добавить следующую версию</button>`}
function recipient(){const d=current(),mode=state.recipientMode||d.access,allowed=!d.revoked&&(mode==='link'||mode==='invited'&&state.viewerSignedIn);return `<div class="reader-shell"><header class="reader-top">${brand()}<button class="btn" data-action="work">Вернуться к автору</button></header>${allowed?`<div class="reader-label"><h1>${esc(d.name)}</h1><span class="tag">${icon(mode==='link'?'link':'people')}${mode==='link'?'Доступ по ссылке':'После входа приглашённого'}</span></div>${report(d,d.published||d.version)}<div class="viewer-foot"><span>Получатель видит выбранную версию · пример</span><span>Без чата, папок и закрытых источников</span></div>`:`<main class="denied"><div class="circle-icon">${icon('lock')}</div><h1>${d.revoked?'Эта ссылка больше не работает':'Чтобы открыть работу, нужен доступ'}</h1><p>${d.revoked?'Автор отключил ссылку. Обратитесь к нему за новым доступом.':mode==='invited'?'Войдите под учётной записью, которую пригласил автор.':'Работа закрыта. Пересланная ссылка не добавляет вас в список получателей.'}</p>${mode==='invited'&&!d.revoked?'<button class="btn primary" data-action="simulate-login">Показать после входа</button>':'<button class="btn" data-action="work">Вернуться к автору</button>'}<p class="small muted" style="margin-top:24px">Прототип: настоящего входа и запросов доступа нет.</p></main>`}</div>`}
function render(){document.getElementById('app').innerHTML=state.view==='recipient'?recipient():`<div class="app">${sidebar()}<div class="workspace">${header()}<main class="content">${state.view==='work'?work():state.view==='versions'?versions():shelf()}</main></div></div>`}
function showDialog(id){lastFocus=document.activeElement;document.getElementById(id).showModal()}
function closeDialog(id){document.getElementById(id).close();if(lastFocus?.isConnected)lastFocus.focus()}
function explainAccess(mode){return mode==='private'?'Содержимое увидите только вы после входа. Передача адреса не откроет работу другому человеку.':mode==='invited'?'Содержимое доступно только добавленным людям после входа. Пересылка ссылки не даёт права доступа.':'Любой получивший ссылку сможет открыть и переслать её. Мы просим поисковики не показывать работу — это не защита от доступа.'}
function shareExtra(){const mode=document.querySelector('input[name="access"]:checked').value,d=current();document.getElementById('mode-explain').innerHTML=`<div class="row">${icon(mode==='link'?'link':'lock')}<span>${explainAccess(mode)}</span></div>`;document.getElementById('invite-box').hidden=mode!=='invited';document.getElementById('link-box').hidden=mode==='private';document.getElementById('search-state').textContent=mode==='link'?'Просим не показывать в поиске':'Содержимое закрыто от поисковиков';document.getElementById('revoke').hidden=!d.published||d.revoked;document.getElementById('invite-list').innerHTML=d.invites.length?d.invites.map((email,i)=>`<div class="invite-person"><span class="badge">П</span><span class="grow">${esc(email)}<br><small class="muted">Просмотр · пример</small></span><button class="btn quiet" data-action="remove-invite" data-index="${i}" aria-label="Удалить ${esc(email)}">${icon('close')}</button></div>`).join(''):'<p class="small muted">Пока никто не добавлен.</p>'}
function share(){const d=current();document.getElementById('share-dialog').innerHTML=`<div class="sheet-head"><div><h2 id="share-title">Поделиться работой</h2><p class="small muted" style="margin-top:6px">${esc(d.name)}</p></div><button class="btn square quiet" data-action="close-share" aria-label="Закрыть доступ">${icon('close')}</button></div><div class="sheet-body"><h3>Кто сможет открыть</h3><div class="access-options">${[['private','Только я','Личная работа. Для открытия нужен ваш вход.'],['invited','Приглашённые','Только добавленные люди после входа.'],['link','По ссылке','Любой, кому передадут ссылку.']].map(([value,label,note])=>`<label class="access-choice"><input type="radio" name="access" value="${value}" ${d.access===value?'checked':''}><span>${icon(accessIcon[value])}</span><span><b>${label}</b><small>${note}</small></span></label>`).join('')}</div><div id="invite-box"><div class="field"><label for="invite-email">Добавить человека · демонстрация</label><div class="row"><input id="invite-email" type="email" placeholder="name@company.ru"><button class="btn" data-action="invite">Добавить</button></div><p class="small muted">Письмо не отправляется. Это пример будущего закрытого доступа.</p><p class="field-error" id="invite-error" role="alert"></p></div><div id="invite-list"></div></div><div id="link-box"><label class="small" for="share-url">Постоянный адрес · пример</label><div class="link-field"><input id="share-url" readonly value="https://polka.example/s/7kN2xQ9m8Wd4pL6aR3sT1v"><button class="btn square" data-action="copy-demo" aria-label="Скопировать демонстрационный адрес">${icon('copy')}</button></div></div><div class="explain" id="mode-explain"></div><div class="row spread" style="margin-top:18px;gap:16px;align-items:flex-start"><span class="small muted">Поисковики</span><span class="small" id="search-state"></span></div><details><summary>Настроить ссылку</summary><div class="field"><label for="link-version">Какую версию показывать</label><select id="link-version"><option value="live" ${!d.pinned?'selected':''}>Обновлять по моему действию</option><option value="pinned" ${d.pinned?'selected':''}>Закрепить версию по ссылке</option></select></div><div class="field"><label for="link-expiry">Срок доступа</label><select id="link-expiry">${['Без срока','7 дней','30 дней'].map(t=>`<option ${d.expiry===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="checks"><label><input type="checkbox" id="copy-allowed" ${d.copy?'checked':''}>Разрешить копию в свою полку</label><label><input type="checkbox" id="download-allowed" ${d.download?'checked':''}>Показывать скачивание оригинала</label><label><input type="checkbox" id="cover-allowed" ${d.previewCover?'checked':''}>Показывать обложку в мессенджерах</label></div><p class="small muted" style="margin-top:12px">Выключенная кнопка скачивания не запрещает снимки экрана. Уже полученные копии отозвать нельзя.</p></details><p class="small muted" style="margin-top:15px">Публичная библиотека и доступ всей компании — следующие этапы.</p><button id="revoke" class="btn danger" style="margin-top:16px" data-action="revoke">Отключить ссылку</button></div><div class="sheet-footer"><button class="btn quiet" data-action="preview-access">Вид получателя</button><button class="btn primary" data-action="save-access">Сохранить доступ</button></div>`;shareExtra();showDialog('share-dialog')}
function upload(paste=false){document.getElementById('upload-dialog').innerHTML=`<div class="sheet-head"><div><h2 id="upload-title">Положить на полку</h2><p class="small muted" style="margin-top:6px">Сначала только вам. Доступ выберете потом.</p></div><button class="btn square quiet" data-action="close-upload" aria-label="Закрыть загрузку">${icon('close')}</button></div><div class="sheet-body"><div class="formtabs"><button class="btn ${!paste?'selected':''}" data-action="upload-file-tab">Файл</button><button class="btn ${paste?'selected':''}" data-action="upload-paste-tab">Вставить HTML</button></div>${paste?'<div class="field"><label for="html-code">Код работы</label><textarea id="html-code" placeholder="Вставьте HTML…" spellcheck="false"></textarea></div>':`<div class="upload-drop">${icon('upload')}<h3>Презентация, отчёт или прототип</h3><p class="small muted">HTML, ZIP, PDF и изображения</p><p class="small muted">В этом прототипе используем готовый пример.</p></div>`}<div class="field"><label for="new-title">Название</label><input id="new-title" maxlength="140" value="Мой новый отчёт"></div><p class="explain">Демонстрация: код не выполняется, файлы не отправляются. На полке появится образец отчёта.</p></div><div class="sheet-footer"><button class="btn quiet" data-action="close-upload">Отмена</button><button class="btn primary" data-action="add-demo">Добавить пример</button></div>`;if(!document.getElementById('upload-dialog').open)showDialog('upload-dialog')}
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;if(state.view==='shelf'||state.view==='folder'){document.getElementById('cards').innerHTML=cards()}else{go('shelf');const el=document.getElementById('search');el.focus()}}});
document.addEventListener('change',e=>{if(e.target.name==='access')shareExtra()});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const d=current();switch(b.dataset.action){
case 'reset':docs=structuredClone(initial);document.querySelectorAll('dialog[open]').forEach(x=>x.close());go('shelf',{folder:'',selected:'pulse',query:'',filter:'all',recipientMode:null,viewerSignedIn:false});break;
case 'home':go('shelf',{filter:'all',query:'',folder:''});break;
case 'recent':go('shelf',{filter:'recent',query:''});break;
case 'favorites':go('shelf',{filter:'favorites',query:''});break;
case 'folder':go('folder',{folder:b.dataset.folder,filter:'all',query:''});break;
case 'open':go('work',{selected:b.dataset.id,query:'',recipientMode:null,viewerSignedIn:false});break;
case 'work':go('work',{recipientMode:null,viewerSignedIn:false});break;
case 'versions':go('versions');break;
case 'share':share();break;
case 'close-share':closeDialog('share-dialog');break;
case 'close-upload':closeDialog('upload-dialog');break;
case 'upload':upload();break;case 'paste':upload(true);break;case 'upload-file-tab':upload();break;case 'upload-paste-tab':upload(true);break;
case 'add-demo':{const name=document.getElementById('new-title').value.trim()||'Новый отчёт';const item={...structuredClone(initial[0]),id:'demo-'+Date.now(),name,folder:state.view==='folder'?state.folder:'Команда',version:1,published:0,access:'private',fav:false,invites:[]};docs.unshift(item);closeDialog('upload-dialog');go('work',{selected:item.id,query:''});toast('Пример добавлен в прототип. Доступ — только вам.');break}
case 'new-version':d.version++;go('work');toast('В прототипе добавлена новая версия. Ссылка пока прежняя.');break;
case 'publish-update':if(!d.pinned&&!d.revoked&&d.access!=='private'){d.published=d.version;render();toast('Пример: по прежней ссылке теперь версия '+d.published)}break;
case 'recipient':go('recipient',{recipientMode:d.access,viewerSignedIn:false});break;
case 'preview-access':{const mode=document.querySelector('input[name="access"]:checked').value;closeDialog('share-dialog');go('recipient',{recipientMode:mode,viewerSignedIn:false});break}
case 'simulate-login':state.viewerSignedIn=true;render();toast('Показан пример после входа приглашённого.');break;
case 'save-access':{d.access=document.querySelector('input[name="access"]:checked').value;d.copy=document.getElementById('copy-allowed').checked;d.download=document.getElementById('download-allowed').checked;d.pinned=document.getElementById('link-version').value==='pinned';d.expiry=document.getElementById('link-expiry').value;d.previewCover=document.getElementById('cover-allowed').checked;if(d.access!=='private'&&!d.published)d.published=d.version;d.revoked=false;closeDialog('share-dialog');render();toast('Настройка сохранена только в прототипе: '+accessLabel[d.access]);break}
case 'revoke':d.revoked=true;closeDialog('share-dialog');go('recipient',{recipientMode:d.access,viewerSignedIn:false});toast('Пример: новые открытия по ссылке отключены.');break;
case 'invite':{const input=document.getElementById('invite-email');const error=document.getElementById('invite-error');if(!input.value||!input.checkValidity()){error.textContent='Укажите корректный email для демонстрации.';break}if(!d.invites.includes(input.value.trim()))d.invites.push(input.value.trim());input.value='';error.textContent='';shareExtra();toast('Человек добавлен в пример. Приглашение не отправлено.');break}
case 'remove-invite':d.invites.splice(Number(b.dataset.index),1);shareExtra();break;
case 'view-version':{const v=Number(b.dataset.version);go('work');const paper=document.querySelector('.paper');paper.outerHTML=`<div class="version-notice"><span>Вы просматриваете <b>версию ${v}</b>. Текущая на полке — ${d.version}.</span><button class="btn" data-action="work">К текущей версии</button></div>`+report(d,v);toast('Просмотр версии '+v+'. Ссылка и текущая работа не изменены.');break}
case 'copy-demo':try{await navigator.clipboard.writeText('https://polka.example/s/7kN2xQ9m8Wd4pL6aR3sT1v');toast('Скопирован демонстрационный адрес, он не ведёт к публикации.')}catch{toast('Выделите пример адреса в поле.')}break;
}});
document.querySelectorAll('dialog').forEach(el=>el.addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus()}));
render();
</script>
</body>
</html>
