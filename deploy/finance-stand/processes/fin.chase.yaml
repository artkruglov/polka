process: fin.chase
version: 2
title: Запросы первички у поставщиков
department: finance
owner: petrova
autonomy: 1
trigger:
  manual: true
  timer: daily 09:30    # после сверки; агрегат сам не пускает запрос чаще раза в 3 дня
match: [первичк, упд, поставщик]
work:
  skill: fin-chase
  executor: auto
  pool: finance
  hook: ../hooks.mjs
review:
  reviewer_required: false
effects:
  edo.request: { auto_from: 2 }
  fin.mail: { auto_from: 2 }
budget_usd: 0.3
