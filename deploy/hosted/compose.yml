# Single-VM hosted pilot: bundled PostgreSQL, external versioned S3, Caddy TLS.
# app/maintenance/storage-check/caddy share the host network so that the app
# and viewer listeners stay on loopback (required by HTML_LIVE_MODE=production);
# only Caddy listens publicly. PostgreSQL is published on 127.0.0.1 only.
# HTML_LIVE_MODE defaults to disabled (static HTML only).
# Not HA: one VM, periodic logical DB backups. See deploy/hosted/README.md.
name: polka-hosted

# Logs go to the host journal (systemd-journald), not to Docker's json-file
# files: `docker compose up -d` recreates app and maintenance on every
# deploy, and a json-file log is deleted with its container. The journal keeps
# them across recreation; its size and age are journald's (SystemMaxUse,
# MaxRetentionSec: see README.md, «Логи»). Needs a VM with systemd (Ubuntu,
# Debian). `docker compose logs` still reads them. Tag: the container name
# (polka-hosted-app-1, polka-hosted-maintenance-1…).
x-logging: &logging
  driver: journald
  options: {tag: "{{.Name}}"}

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-runtime-env: &runtime-env
  DATABASE_URL: postgres://polka_runtime:${POLKA_RUNTIME_PASSWORD:?}@127.0.0.1:5432/polka
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:?}
  LINK_KEY: ${LINK_KEY:?}
  APP_ORIGIN: https://${APP_HOST:?}
  # AGPL-3.0 § 13: where users get this installation's source. A modified
  # Полка must point at its modified source. Empty: the upstream repository.
  SOURCE_URL: ${SOURCE_URL:-}
  HOST: 127.0.0.1
  PORT: "4390"
  VIEWER_ORIGIN: https://${VIEWER_HOST_NAME:?}
  VIEWER_HOST: 127.0.0.1
  VIEWER_PORT: "4391"
  # Caddy connects from loopback and overwrites X-Forwarded-For.
  TRUST_PROXY: 127.0.0.1
  COOKIE_SECURE: "true"
  # disabled | production. production needs VIEWER_HOST_NAME DNS/TLS in place.
  HTML_LIVE_MODE: ${HTML_LIVE_MODE:-disabled}
  ACCOUNT_DELETION_ENABLED: "false"
  # Import by link (docs/specs/URL_IMPORT_SUPPORT.md). GITHUB_TOKEN is optional:
  # gists without it are limited to 60 GitHub API requests an hour.
  URL_IMPORT_ENABLED: ${URL_IMPORT_ENABLED:-false}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  # Rendered snapshots of allowlisted SPA hosts (Lovable, bolt.host, Replit,
  # GitHub Pages, Gemini share). Off by default. RENDERER_URL: the renderer
  # service below (http://127.0.0.1:4395, --profile renderer) or a separate
  # VM (https://…, deploy/renderer/README.md). RENDERER_SECRET: shared with it.
  RENDERED_IMPORT_ENABLED: ${RENDERED_IMPORT_ENABLED:-false}
  RENDERER_URL: ${RENDERER_URL:-}
  RENDERER_SECRET: ${RENDERER_SECRET:-}
  RENDERER_CA: ${RENDERER_CA:-}
  MAIL_MODE: ${MAIL_MODE:-disabled}
  # Used only with MAIL_MODE=smtp (for example Yandex Cloud Postbox).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-}
  # invite: codes only for existing accounts and EMAIL_SIGNUP_ALLOW entries.
  EMAIL_SIGNUP: ${EMAIL_SIGNUP:-invite}
  EMAIL_SIGNUP_ALLOW: ${EMAIL_SIGNUP_ALLOW:-}
  # New shelves per day, whole installation and per client IP.
  EMAIL_SIGNUP_DAILY_LIMIT: ${EMAIL_SIGNUP_DAILY_LIMIT:-50}
  EMAIL_SIGNUP_DAILY_PER_IP: ${EMAIL_SIGNUP_DAILY_PER_IP:-3}
  # Anti-spam at sign-up: new shelves per day per /24 network and per mail
  # domain (not the large public providers). 0: no limit.
  EMAIL_SIGNUP_DAILY_PER_SUBNET: ${EMAIL_SIGNUP_DAILY_PER_SUBNET:-10}
  EMAIL_SIGNUP_DAILY_PER_DOMAIN: ${EMAIL_SIGNUP_DAILY_PER_DOMAIN:-20}
  # Sign-in rules (docs/specs/SIGN_IN_PROVIDERS.md). New shelves by an
  # emailed code only on Russian mail domains here; existing accounts keep
  # their codes unless EMAIL_LOGIN_DOMAINS=signup.
  EMAIL_SIGNUP_DOMAINS: ${EMAIL_SIGNUP_DOMAINS:-ru-only}
  EMAIL_LOGIN_DOMAINS: ${EMAIL_LOGIN_DOMAINS:-any}
  # Яндекс ID and VK ID: a provider is off until its client is set.
  YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
  YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
  YANDEX_EMAIL_VERIFIED: ${YANDEX_EMAIL_VERIFIED:-true}
  VK_CLIENT_ID: ${VK_CLIENT_ID:-}
  VK_EMAIL_VERIFIED: ${VK_EMAIL_VERIFIED:-false}
  # A company's own IdP (OpenID Connect) and organisation access.
  OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_NAME: ${OIDC_NAME:-}
  OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
  OIDC_ORG_CLAIM: ${OIDC_ORG_CLAIM:-}
  OIDC_ORG_VALUE: ${OIDC_ORG_VALUE:-}
  OIDC_ORG_LIBRARY: ${OIDC_ORG_LIBRARY:-}
  ORG_DOMAINS: ${ORG_DOMAINS:-}
  # on | owner-notes | off. owner-notes: only a work's owner writes notes,
  # recipients read them (no recipient comments, reactions or letters).
  COMMENTS_MODE: ${COMMENTS_MODE:-owner-notes}
  # Abuse protection (docs/specs/ABUSE_PROTECTION.md). off | auto | flagged |
  # new-accounts | all: which new links wait for the operator.
  SHARE_MODERATION: ${SHARE_MODERATION:-auto}
  TRUST_MIN_CLEAN_SAVES: ${TRUST_MIN_CLEAN_SAVES:-3}
  # Prohibited-content filter (docs/specs/CONTENT_FILTER.md).
  CONTENT_FILTER_MODE: ${CONTENT_FILTER_MODE:-strict}
  CONTENT_FILTER_AUTOBLOCK: ${CONTENT_FILTER_AUTOBLOCK:-false}
  MODERATION_RETENTION: ${MODERATION_RETENTION:-}
  OPERATOR_CONTACT: ${OPERATOR_CONTACT:-}
  CONTENT_MODEL_PROVIDER: ${CONTENT_MODEL_PROVIDER:-off}
  # Empty URL: the provider's own (AI Studio or api.neuraldeep.ru).
  CONTENT_MODEL_URL: ${CONTENT_MODEL_URL:-}
  CONTENT_MODEL_PRIMARY: ${CONTENT_MODEL_PRIMARY:-}
  CONTENT_MODEL_FALLBACK: ${CONTENT_MODEL_FALLBACK:-}
  CONTENT_CODE_MODEL: ${CONTENT_CODE_MODEL:-}
  CONTENT_MODEL_PRIMARY_OPTIONS: ${CONTENT_MODEL_PRIMARY_OPTIONS:-}
  CONTENT_MODEL_FALLBACK_OPTIONS: ${CONTENT_MODEL_FALLBACK_OPTIONS:-}
  CONTENT_CODE_MODEL_OPTIONS: ${CONTENT_CODE_MODEL_OPTIONS:-}
  CONTENT_MODEL_PRICES_RUB: ${CONTENT_MODEL_PRICES_RUB:-}
  CONTENT_MODEL_API_KEY: ${CONTENT_MODEL_API_KEY:-}
  # Per role: empty inherits the primary's (a key only on the same URL).
  CONTENT_MODEL_FALLBACK_PROVIDER: ${CONTENT_MODEL_FALLBACK_PROVIDER:-}
  CONTENT_MODEL_FALLBACK_URL: ${CONTENT_MODEL_FALLBACK_URL:-}
  CONTENT_MODEL_FALLBACK_API_KEY: ${CONTENT_MODEL_FALLBACK_API_KEY:-}
  CONTENT_CODE_MODEL_PROVIDER: ${CONTENT_CODE_MODEL_PROVIDER:-}
  CONTENT_CODE_MODEL_URL: ${CONTENT_CODE_MODEL_URL:-}
  CONTENT_CODE_MODEL_API_KEY: ${CONTENT_CODE_MODEL_API_KEY:-}
  # Rate limits per endpoint (empty: 20 rpm / 3 parallel on NeuralDeep, none
  # elsewhere) and flat-rate keys (cost 0 for the budget).
  CONTENT_MODEL_RPM: ${CONTENT_MODEL_RPM:-}
  CONTENT_MODEL_MAX_CONCURRENCY: ${CONTENT_MODEL_MAX_CONCURRENCY:-}
  CONTENT_MODEL_FLAT_RATE: ${CONTENT_MODEL_FLAT_RATE:-}
  CONTENT_MODEL_FALLBACK_RPM: ${CONTENT_MODEL_FALLBACK_RPM:-}
  CONTENT_MODEL_FALLBACK_MAX_CONCURRENCY: ${CONTENT_MODEL_FALLBACK_MAX_CONCURRENCY:-}
  CONTENT_MODEL_FALLBACK_FLAT_RATE: ${CONTENT_MODEL_FALLBACK_FLAT_RATE:-}
  CONTENT_CODE_MODEL_RPM: ${CONTENT_CODE_MODEL_RPM:-}
  CONTENT_CODE_MODEL_MAX_CONCURRENCY: ${CONTENT_CODE_MODEL_MAX_CONCURRENCY:-}
  CONTENT_CODE_MODEL_FLAT_RATE: ${CONTENT_CODE_MODEL_FLAT_RATE:-}
  # NeuralDeep models served on its own hardware in Russia; empty: the default list.
  CONTENT_MODEL_ND_ALLOWED: ${CONTENT_MODEL_ND_ALLOWED:-}
  CONTENT_MODEL_TIMEOUT_MS: ${CONTENT_MODEL_TIMEOUT_MS:-8000}
  CONTENT_MODEL_IMAGES: ${CONTENT_MODEL_IMAGES:-true}
  CONTENT_MODEL_DAILY_BUDGET_RUB: ${CONTENT_MODEL_DAILY_BUDGET_RUB:-500}
  CONTENT_VISION_MODERATION: ${CONTENT_VISION_MODERATION:-false}
  # Moderation letters with one-click actions; empty: none (scripts only).
  # Needs MAIL_MODE=smtp.
  OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
  MODERATION_AUTOPAUSE_REPORTS: ${MODERATION_AUTOPAUSE_REPORTS:-3}
  NEW_ACCOUNT_DAYS: ${NEW_ACCOUNT_DAYS:-7}
  NEW_ACCOUNT_MAX_LINKS: ${NEW_ACCOUNT_MAX_LINKS:-5}
  NEW_ACCOUNT_DAILY_LINKS: ${NEW_ACCOUNT_DAILY_LINKS:-10}
  # Operator status for an external monitor; empty keeps /api/ops/status off.
  # The app key only lists BACKUP_BUCKET to report the newest dump's age.
  OPS_STATUS_TOKEN: ${OPS_STATUS_TOKEN:-}
  OPS_BACKUP_BUCKET: ${BACKUP_BUCKET:?}

networks:
  polka:
    ipam:
      config: [{subnet: 172.28.0.0/24}]
  # The renderer's own network: it shares nothing with postgres, backup or
  # the host-network services; the app reaches it on 127.0.0.1:4395 only.
  render:
    ipam:
      config: [{subnet: 172.29.0.0/24}]

volumes:
  pgdata:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    restart: unless-stopped
    environment:
      POSTGRES_USER: polka_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POLKA_SCHEMA_PASSWORD: ${POLKA_SCHEMA_PASSWORD:?}
      POLKA_RUNTIME_PASSWORD: ${POLKA_RUNTIME_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # Loopback only, for the host-network services; never 0.0.0.0.
    ports: ["127.0.0.1:5432:5432"]
    networks: [polka]
    healthcheck:
      # TCP, not the socket: during first-boot init a temporary server
      # accepts socket connections only, and migrate connects over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U polka_admin -d polka"]
      interval: 5s
      retries: 30
    logging: *logging

  migrate:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment:
      DATABASE_URL: postgres://polka_schema:${POLKA_SCHEMA_PASSWORD:?}@postgres:5432/polka
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-120000}
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    networks: [polka]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  grants:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    environment:
      PGHOST: postgres
      PGDATABASE: polka
      PGUSER: polka_schema
      PGPASSWORD: ${POLKA_SCHEMA_PASSWORD:?}
    volumes: ["../runtime-grants.sql:/grants/runtime-grants.sql:ro"]
    command: ["psql", "-X", "--set=ON_ERROR_STOP=1", "--set=schema_owner=polka_schema",
              "--set=runtime_role=polka_runtime", "--file=/grants/runtime-grants.sql"]
    networks: [polka]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  storage-check:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "scripts/storage-check.ts", "--confirm-bootstrap"]
    network_mode: host
    depends_on:
      grants: {condition: service_completed_successfully}
    restart: "no"

  app:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "apps/server/main.ts"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      storage-check: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4390/readyz',{signal:AbortSignal.timeout(1500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1536M}

  maintenance:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "scripts/maintenance-runner.ts"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?}
      VIEWER_HOST_NAME: ${VIEWER_HOST_NAME:?}
    # Binds 80/443 (TCP, and UDP 443 for HTTP/3) directly on the host and
    # reaches the loopback listeners 127.0.0.1:4390 (app) and :4391 (viewer).
    network_mode: host
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    logging: *logging

  backup:
    # Built locally from the pinned postgres image (pg_dump matches the server)
    # plus the AWS CLI: `docker compose --env-file hosted.env up -d --build`.
    build: ./backup
    image: polka-backup:local
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      BACKUP_DATABASE_URL: postgres://polka_schema:${POLKA_SCHEMA_PASSWORD:?}@postgres:5432/polka
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Prefer a dedicated write-only key for the backups bucket; the app key
      # is only a fallback for installations that have not created one yet.
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY:?}}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Unhealthy when no dump was uploaded within the interval plus one hour.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last-success && test $$(( $$(date +%s) - $$(cat /tmp/last-success) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS:-86400} + 3600 ))"]
      interval: 5m
      timeout: 5s
      start_period: 10m
    networks: [polka]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging

  # Headless renderer on this VM (opt-in: docker compose --profile renderer up -d).
  # For a separate VM use deploy/renderer instead. Chromium goes out only
  # through the egress proxy inside the container, which refuses private,
  # link-local (169.254.169.254) and docker addresses; see
  # deploy/renderer/README.md. About 1–1.5 GB RAM while a page renders.
  renderer:
    profiles: ["renderer"]
    build:
      context: ../..
      dockerfile: apps/renderer/Dockerfile
    image: polka-renderer:local
    restart: unless-stopped
    environment:
      RENDERER_SECRET: ${RENDERER_SECRET:-}
    networks: [render]
    ports: ["127.0.0.1:4395:4395"]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    shm_size: 256m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1536M, pids: 256}
    logging: *logging
