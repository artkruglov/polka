# Single-VM hosted pilot: bundled PostgreSQL, external versioned S3, Caddy TLS.
# app/maintenance/storage-check/caddy share the host network so that the app
# and viewer listeners stay on loopback (required by HTML_LIVE_MODE=production);
# only Caddy listens publicly. PostgreSQL is published on 127.0.0.1 only.
# HTML_LIVE_MODE defaults to disabled (static HTML only).
# Not HA: one VM, periodic logical DB backups. See deploy/hosted/README.md.
name: polka-hosted

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-runtime-env: &runtime-env
  DATABASE_URL: postgres://polka_runtime:${POLKA_RUNTIME_PASSWORD:?}@127.0.0.1:5432/polka
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}
  S3_BUCKET: ${S3_BUCKET:?}
  LINK_KEY: ${LINK_KEY:?}
  APP_ORIGIN: https://${APP_HOST:?}
  HOST: 127.0.0.1
  PORT: "4390"
  VIEWER_ORIGIN: https://${VIEWER_HOST_NAME:?}
  VIEWER_HOST: 127.0.0.1
  VIEWER_PORT: "4391"
  # Caddy connects from loopback and overwrites X-Forwarded-For.
  TRUST_PROXY: 127.0.0.1
  COOKIE_SECURE: "true"
  # disabled | production. production needs VIEWER_HOST_NAME DNS/TLS in place.
  HTML_LIVE_MODE: ${HTML_LIVE_MODE:-disabled}
  ACCOUNT_DELETION_ENABLED: "false"
  URL_IMPORT_ENABLED: "false"
  MAIL_MODE: ${MAIL_MODE:-disabled}

networks:
  polka:
    ipam:
      config: [{subnet: 172.28.0.0/24}]

volumes:
  pgdata:
  caddy-data:
  caddy-config:

services:
  postgres:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    restart: unless-stopped
    environment:
      POSTGRES_USER: polka_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?}
      POLKA_SCHEMA_PASSWORD: ${POLKA_SCHEMA_PASSWORD:?}
      POLKA_RUNTIME_PASSWORD: ${POLKA_RUNTIME_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    # Loopback only, for the host-network services; never 0.0.0.0.
    ports: ["127.0.0.1:5432:5432"]
    networks: [polka]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polka_admin -d polka"]
      interval: 5s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  migrate:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment:
      DATABASE_URL: postgres://polka_schema:${POLKA_SCHEMA_PASSWORD:?}@postgres:5432/polka
      MIGRATION_STATEMENT_TIMEOUT_MS: ${MIGRATION_STATEMENT_TIMEOUT_MS:-120000}
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    networks: [polka]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  grants:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    environment:
      PGHOST: postgres
      PGDATABASE: polka
      PGUSER: polka_schema
      PGPASSWORD: ${POLKA_SCHEMA_PASSWORD:?}
    volumes: ["../runtime-grants.sql:/grants/runtime-grants.sql:ro"]
    command: ["psql", "-X", "--set=ON_ERROR_STOP=1", "--set=schema_owner=polka_schema",
              "--set=runtime_role=polka_runtime", "--file=/grants/runtime-grants.sql"]
    networks: [polka]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: "no"

  storage-check:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "scripts/storage-check.ts", "--confirm-bootstrap"]
    network_mode: host
    depends_on:
      grants: {condition: service_completed_successfully}
    restart: "no"

  app:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "apps/server/main.ts"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      storage-check: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4390/readyz',{signal:AbortSignal.timeout(1500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1536M}

  maintenance:
    <<: *hardening
    image: ${POLKA_IMAGE:?}
    user: node
    environment: *runtime-env
    command: ["node", "--import", "tsx", "scripts/maintenance-runner.ts"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 768M}

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?}
      VIEWER_HOST_NAME: ${VIEWER_HOST_NAME:?}
    # Binds 80/443 (TCP, and UDP 443 for HTTP/3) directly on the host and
    # reaches the loopback listeners 127.0.0.1:4390 (app) and :4391 (viewer).
    network_mode: host
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  backup:
    # Built locally from the pinned postgres image (pg_dump matches the server)
    # plus the AWS CLI: `docker compose --env-file hosted.env up -d --build`.
    build: ./backup
    image: polka-backup:local
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      BACKUP_DATABASE_URL: postgres://polka_schema:${POLKA_SCHEMA_PASSWORD:?}@postgres:5432/polka
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Prefer a dedicated write-only key for the backups bucket; the app key
      # is only a fallback for installations that have not created one yet.
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?}}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-${S3_SECRET_KEY:?}}
      BACKUP_BUCKET: ${BACKUP_BUCKET:?}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    # Unhealthy when no dump was uploaded within the interval plus one hour.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/last-success && test $$(( $$(date +%s) - $$(cat /tmp/last-success) )) -lt $$(( $${BACKUP_INTERVAL_SECONDS:-86400} + 3600 ))"]
      interval: 5m
      timeout: 5s
      start_period: 10m
    networks: [polka]
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
