# Полка's headless renderer on its own VM (deploy/renderer/README.md).
# Caddy terminates TLS for RENDERER_HOST and passes only requests from the
# main VM's address (APP_VM_IP) to the renderer; every request is also signed
# with RENDERER_SECRET (HMAC, 60 s). The renderer publishes no port itself.
#   cp renderer.env.example renderer.env  # fill it in
#   docker compose --env-file renderer.env up -d --build
name: polka-renderer

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

networks:
  renderer: {}

volumes:
  caddy-data:
  caddy-config:

services:
  renderer:
    build:
      context: ../..
      dockerfile: apps/renderer/Dockerfile
    image: polka-renderer:local
    restart: unless-stopped
    environment:
      RENDERER_SECRET: ${RENDERER_SECRET:?Set RENDERER_SECRET (openssl rand -hex 32), the same as on the main VM}
    networks: [renderer]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    shm_size: 256m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    logging: *logging
    deploy:
      resources:
        # One page at a time: Chromium plus the page stay well under this.
        limits: {cpus: "1.5", memory: 1536M, pids: 256}

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      RENDERER_HOST: ${RENDERER_HOST:?Set RENDERER_HOST (the renderer's DNS name)}
      APP_VM_IP: ${APP_VM_IP:?Set APP_VM_IP (the main VM's public or internal address)}
    ports: ["80:80", "443:443"]
    networks: [renderer]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [renderer]
    logging: *logging
