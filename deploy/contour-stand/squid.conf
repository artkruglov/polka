# The only way out of the task network (deploy/contour-stand/README.md).
# Squid listens on the task bridge; the firewall lets the sandboxes reach
# nothing else on the VM. A task reaches only what its profile names:
# dispatcher.mjs writes one block per running task to contour-tasks.conf.
http_port 10.77.0.1:3128
visible_hostname contour-proxy
cache deny all
pid_filename /run/squid.pid

acl to_lo dst 127.0.0.1/32
acl p_polka port 4390
acl p_model port 4000
acl p_git port 3000
acl CONNECT method CONNECT

# Nothing encrypted leaves: every allowed destination is internal HTTP, so
# the proxy sees each request. TLS to the outside is refused outright.
http_access deny CONNECT
include /etc/squid/contour-tasks.conf
http_access deny all

# Git: the agent never holds the token. Whatever Authorization it sends to
# Gitea is dropped and the bot's token is added here (contour-secrets.conf,
# rendered from OpenBao by stand.sh, readable by root and squid only).
request_header_access Authorization deny p_git
include /etc/squid/contour-secrets.conf

access_log daemon:/var/log/squid/access.log squid
logfile_rotate 3
